template {
    source = "/app/environment.ctmpl"
    destination = "/app/environment"
}

exec {
    command = "env $(cat /app/environment | grep -v ^# | xargs) botbot-bot --logtostderr=1 --stderrthreshold=0 --v=2"
    splay = "5s"
    reload_signal = "SIGHUP"
    kill_signal = "SIGTERM"
    kill_timeout = "30s"
}
